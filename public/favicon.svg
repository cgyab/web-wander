<svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
  <!-- WebWander — footprints wandering across the dark wilds. -->
  <rect width="64" height="64" rx="10" fill="#0a0a12"/>
  <!-- trailing foot (cool blue) -->
  <g fill="#8fd0ff" transform="translate(13,32) rotate(-14)">
    <ellipse cx="6" cy="8" rx="6" ry="9"/>
    <circle cx="1.5" cy="-1.5" r="2"/>
    <circle cx="6" cy="-3" r="2.2"/>
    <circle cx="10.5" cy="-1.5" r="2"/>
  </g>
  <!-- leading foot (gold) -->
  <g fill="#ffd86b" transform="translate(34,15) rotate(-14)">
    <ellipse cx="6" cy="8" rx="6" ry="9"/>
    <circle cx="1.5" cy="-1.5" r="2"/>
    <circle cx="6" cy="-3" r="2.2"/>
    <circle cx="10.5" cy="-1.5" r="2"/>
  </g>
</svg>
